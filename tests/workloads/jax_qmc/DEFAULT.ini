##########################################################
[DEFAULT]
##########################################################
# Physics
hbar = 197.327
mass_p = 938.27231
mass_n = 939.56563
ndim = 3

##########################################################
[params]
##########################################################
# System
# Alternative to a name, specify n neutrons and z protons with the name nN+zZ e.g. 13N+14Z
# This alternative starts with floor((n+z)/2) spin up particles
nuc_name = 4He
# Density of periodic matter, nonzero value implies periodic evaluation
# EM screening is assumed for periodic matter
rho = 0  # fm^-3

# Metropolis
seed_walk = 21
dt = 0.001
neq = 10
nav = 10
nac = 1
nvoid = 100
nwalk = 3200
rec_r = True  # recover coordinates and spin
rec_k = True  # recover key
conserved_sz = True

# Wavefunction
seed_net = 19
ndense = 32
nsingle = 16
nlat = 32
backflow_type = MPNN
asymm_type = pfaffian
amplitude_limit = 8  # self.a in Asymm.py which limits maximum amplitude.
activation_function = Tanh

# MPNN
mpnn_layers = 1
mpnn_output_size = 16
mpnn_dense_depth = 2

minimal_mpnn_dense_depth = 3

# Transformers
tr_perceptrons_per_layer = 2
transformer_num_heads = 4
transformer_hidden_size = 32
transformer_layers = 1
transformer_output_size = 32

# Hidden wavefunction
nhid = 1
hidden_orb_depth = 3

# Pfaffian wavefunction
pfaffian_phi_depth = 3
# Pfaffian computation: Parlett-Reid or Householder
pfaffian_compute = Parlett-Reid

# Choose Laplacian for the kinetic energy: Jax or Folx
laplacian = Folx

# Optimization
# Choose solver for optimizer: Adam, Cholesky, Pseudo, or CG
solver = CG
# jax.scipy, solve_fori_loop, solve_while_loop
iterative = solve_fori_loop
nopt = 600
delta = 0.0004
eps = 0.001
conf = 0.05
mix = 0.00
module_load = False
module_lit_load = False
module_save = True

lbd = 0.0
alpha_spring = 0.0
alpha = 0.9
beta = 0.99

# Observables
omega = 0.0
nrho = 100  # number of points in rho
L2_coupling = 0.0  # 3.5
Lz_coupling = 0.0  # 15.0
pot_name = pionless_lo_o  # potential model
pot_3b_name = R3_1.1  # 3b potential model
box_dist = 1 # Range of periodic boxes that potential includes

# Utility values
output_name = %(pot_name)s_%(nuc_name)s
